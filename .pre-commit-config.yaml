# Local hooks. CI is the authoritative check; these only shorten the feedback loop.
#
# Setup:
#   npm ci
#   pre-commit install --hook-type commit-msg
repos:
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (one-line Conventional Commit with a scope, Co-authored-by trailers only)
        entry: npx --no-install commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
