name: Feature
description: A new capability, or a change to how something works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Sketch it if it helps.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How we will know it is finished.
      placeholder: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Alternatives and context
      description: Other approaches considered, prior art, links. Optional.
